# Rakentaa asennettavan Android-sovelluksen (APK) jokaisesta muutoksesta.
# Lataus: GitHub → Actions → uusin "Android APK" -ajo → Artifacts → FODMAP-tutka-apk.
name: Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # Sydänmerkki-lista päivittyy jokaiseen versioon. Jos sivusto ei vastaa, käytetään edellistä listaa.
      - name: Update Sydänmerkki product list
        continue-on-error: true
        run: node scripts/fetch-sydanmerkki.mjs

      # Lisäravinnetietokanta kerätään terveyskauppojen sivuilta enintään kerran viikossa.
      - name: Week number
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore supplement database
        id: supp-cache
        uses: actions/cache/restore@v4
        with:
          path: src/data/supplements-db.json
          key: supplements-db-${{ steps.week.outputs.week }}

      - name: Update supplement database
        id: supp-fetch
        if: steps.supp-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: node scripts/fetch-supplements.mjs

      - name: Save supplement database
        if: steps.supp-fetch.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: src/data/supplements-db.json
          key: supplements-db-${{ steps.week.outputs.week }}

      - name: Test
        run: |
          npm test
          npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FODMAP-tutka-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
