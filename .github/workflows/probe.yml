# Väliaikainen: tutkii tietolähteitä. Poistetaan tutkimuksen jälkeen.
name: Probe data sources
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Shopify product data
        run: |
          for site in puhdasplus.fi www.ruohonjuuri.fi; do
            echo "##### $site"
            curl -s "https://$site/products.json?limit=250&page=1" -o p.json -w 'products.json status %{http_code} size %{size_download}\n'
            python3 - <<'PY'
          import json
          try:
              d=json.load(open('p.json'))
          except Exception as e:
              print('not json', e); raise SystemExit
          ps=d.get('products',[])
          print('products on page 1:', len(ps))
          if ps:
              v=ps[0]['variants'][0]
              print('variant keys:', sorted(v.keys()))
              print('product keys:', sorted(ps[0].keys()))
          for p in ps:
              if 'magnes' in p['title'].lower():
                  print('---', p['title'], p['handle'], p.get('vendor'), [ (v.get('barcode'), v.get('sku')) for v in p['variants']][:3])
                  print(p['body_html'][:1500].replace('\n',' '))
                  break
          PY
          done
          H=$(curl -s 'https://www.ruohonjuuri.fi/search?q=iltamagnesium' | grep -o '/products/[^"?]*iltamagnesium[^"?]*' | head -1)
          echo "ruohonjuuri handle: $H"
          [ -n "$H" ] && curl -s "https://www.ruohonjuuri.fi$H.js" | python3 -c "import json,sys; p=json.load(sys.stdin); print(p['title'], p.get('vendor')); print([(v.get('barcode'),v.get('sku')) for v in p['variants']]); print(p['description'][:2500])"
          curl -s 'https://puhdasplus.fi/products/night-time-magnesium-120-kaps.js' | python3 -c "import json,sys; p=json.load(sys.stdin); print(p['title']); print([(v.get('barcode'),v.get('sku')) for v in p['variants']]); print(p['description'][:2500])" || true
