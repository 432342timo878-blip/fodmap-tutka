# Väliaikainen: selvittää tuotetietolähteiden rakenteen. Poistetaan tutkimuksen jälkeen.
name: Probe data sources
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Sydanmerkki search API
        run: |
          curl -sL 'https://www.sydanmerkki.fi/tuotteet' -o l.html
          grep -o -i '.\{300\}api/search/products.json.\{400\}' l.html | head -2
          for u in 'https://www.sydanmerkki.fi/api/search/products.json' 'https://www.sydanmerkki.fi/api/search/products.json?q=kaura' 'https://www.sydanmerkki.fi/api/search/products.json?query=kaura'; do
            echo "== $u"; curl -sL "$u" -o a.json -w 'status %{http_code} size %{size_download}\n'; head -c 1500 a.json; echo
          done
          echo "pages:"; grep -o 'page=[0-9]*' l.html | sort -t= -k2 -n -u | tail -3
          grep -o -i '[0-9]\+ tuotetta\|tuotteita [0-9]\+\|[0-9]\+ hakutulos[a-z]*' l.html | head
