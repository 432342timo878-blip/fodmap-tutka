# Väliaikainen: tutkii tietolähteitä. Poistetaan tutkimuksen jälkeen.
name: Probe data sources
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Shops
        run: |
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Mobile Safari/537.36'
          for h in puhdistamo.fi www.puhdistamo.fi life.fi www.life.fi www.sokos.fi www.apteekki360.fi www.yliopistonapteekki.fi www.fitnesstukku.fi www.proteinstore.fi www.bodystore.com www.myprotein.fi www.mehilainen.fi www.apteekkituote.fi www.k-ruoka.fi www.s-kaupat.fi www.prisma.fi www.foodie.fi; do
            code=$(curl -s -A "$UA" -o p.json -w '%{http_code}' --max-time 20 "https://$h/products.json?limit=1")
            shopify=$(python3 -c "import json;d=json.load(open('p.json'));print('SHOPIFY', len(d.get('products',[])))" 2>/dev/null || echo no)
            home=$(curl -s -A "$UA" -o h.html -w '%{http_code} %{size_download}' --max-time 20 "https://$h/")
            gtin=$(grep -o -i 'gtin1\?3\?"' h.html | head -1)
            sm=$(curl -s -A "$UA" -o /dev/null -w '%{http_code}' --max-time 20 "https://$h/sitemap.xml")
            echo "$h | products.json $code $shopify | home $home | sitemap $sm | $(grep -o -i 'magento\|woocommerce\|shopify\|next-data\|__NEXT_DATA__\|nuxt\|vtex\|commercetools' h.html | sort -u | tr '\n' ' ')"
          done
      - name: Open Food Facts dumps
        run: |
          for u in https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz https://static.openfoodfacts.org/data/openfoodfacts-products.jsonl.gz https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv; do
            curl -sI --max-time 20 "$u" | grep -i -E '^(HTTP|content-length)' | tr '\r\n' '  '; echo " $u"
          done
