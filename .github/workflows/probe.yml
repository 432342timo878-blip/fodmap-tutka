# Väliaikainen: tutkii tietolähteitä. Poistetaan tutkimuksen jälkeen.
name: Probe data sources
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Shops
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Mobile Safari/537.36'
          for h in www.fitnesstukku.fi www.bodystore.com www.myprotein.fi www.apteekkituote.fi www.k-ruoka.fi www.s-kaupat.fi www.prisma.fi www.ruokaboksi.fi www.verkkoapteekki.fi www.ruohonjuuri.fi www.apteekki360.fi; do
            code=$(curl -s -A "$UA" -o p.json -w '%{http_code}' --max-time 20 "https://$h/products.json?limit=250")
            shopify=$(python3 -c "import json;d=json.load(open('p.json'));print('SHOPIFY', len(d.get('products',[])))" 2>/dev/null || echo no)
            home=$(curl -s -A "$UA" -o h.html -w '%{http_code} %{size_download}' --max-time 20 "https://$h/")
            echo "$h | products.json $code $shopify | home $home | $(grep -o -i 'magento\|woocommerce\|shopify\|__NEXT_DATA__\|nuxt\|vtex' h.html | sort -u | tr '\n' ' ')"
          done
          echo "--- apteekki360 sample"
          curl -s 'https://www.apteekki360.fi/products.json?limit=250' | python3 -c "
          import json,sys,collections; ps=json.load(sys.stdin)['products']
          print(collections.Counter(p['product_type'] for p in ps).most_common(10))
          print([ (v.get('sku'),v.get('barcode')) for p in ps[:3] for v in p['variants'][:1]])"
          echo "--- yliopiston apteekki"
          curl -s -A "$UA" --max-time 20 https://www.yliopistonapteekki.fi/robots.txt | grep -i sitemap
          P=$(curl -s -A "$UA" 'https://www.yliopistonapteekki.fi/vitamiinit-ja-ravinto/magnesium' | grep -o 'href="https://www.yliopistonapteekki.fi/[^"]*magnes[^"]*"' | grep -v '/vitamiinit-ja-ravinto/magnesium"' | head -1 | sed 's/href="//;s/"$//')
          echo "product: $P"
          curl -s -A "$UA" "$P" -o y.html; grep -o -i '"gtin1\?3\?" *: *"[0-9]*"\|ean[^<]\{0,40\}[0-9]\{13\}' y.html | head -3
          sed 's/<[^>]*>/\n/g' y.html | grep -i -E '[0-9] ?(mg|µg)' | sort -u | head -8
      - name: Open Food Facts dumps
        shell: bash
        run: |
          set +e
          for u in https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz https://static.openfoodfacts.org/data/openfoodfacts-products.jsonl.gz; do
            curl -sIL --max-time 20 "$u" | grep -i -E '^(HTTP|content-length)' | tr '\r\n' '  '; echo " $u"
          done
