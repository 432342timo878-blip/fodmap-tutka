# Väliaikainen: tutkii tietolähteitä. Poistetaan tutkimuksen jälkeen.
name: Probe data sources
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ruohonjuuri product page
        run: |
          curl -s 'https://www.ruohonjuuri.fi/products/puhdistamo-iltamagnesium-120-kps-104-g' -o p.html -w 'status %{http_code} size %{size_download}\n'
          grep -o -i '.\{120\}\(ravintosisältö\|päiväannos\|vuorokausiannos\|4 kapselia\|sisältää\).\{300\}' p.html | sed 's/<[^>]*>/ /g' | tr -s ' ' | head -8
          echo "--- mg/µg mentions"
          sed 's/<[^>]*>/\n/g' p.html | grep -i -E '[0-9] ?(mg|µg|mcg)' | tr -s ' ' | sort -u | head -30
          echo "--- metafield-ish"
          grep -o -i '"\(ingredients\|nutrition\|ainesosat\|ravinto\)[a-z_]*" *: *"[^"]\{0,400\}' p.html | head -5
          echo "--- products.json page count"
          for i in 5 10 20 30 40; do echo "page $i: $(curl -s "https://www.ruohonjuuri.fi/products.json?limit=250&page=$i" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["products"]))')"; done
          curl -s "https://www.ruohonjuuri.fi/products.json?limit=250&page=1" | python3 -c '
          import json,sys,collections
          ps=json.load(sys.stdin)["products"]
          print(collections.Counter(p["product_type"] for p in ps).most_common(15))
          import re
          print("sku with ean:", sum(1 for p in ps for v in p["variants"] if v.get("sku") and re.search(r"\d{13}$", v["sku"])), "of", sum(len(p["variants"]) for p in ps))'
