# Väliaikainen: tutkii tietolähteitä. Poistetaan tutkimuksen jälkeen.
name: Probe data sources
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Sydanmerkki criteria full text
        run: |
          curl -sL 'https://www.sydanmerkki.fi/elintarviketeollisuus/tuotteiden_myontamisperusteet' -o k.html
          python3 - <<'PY'
          import re,html
          s=open('k.html',encoding='utf-8',errors='ignore').read()
          s=re.sub(r'(?s)<(script|style|nav|header|footer)[^>]*>.*?</\1>',' ',s)
          s=re.sub(r'(?i)<(br|/p|/div|/li|/tr|/h\d|/td|/th)[^>]*>','\n',s)
          t=html.unescape(re.sub(r'<[^>]+>',' ',s))
          lines=[re.sub(r'\s+',' ',l).strip() for l in t.split('\n')]
          lines=[l for l in lines if l]
          i=max(i for i,l in enumerate(lines) if l.startswith('Tuotteelle voidaan myöntää Sydänmerkki'))
          print('\n'.join(lines[i:]))
          PY
      - name: Tokmanni search page
        run: |
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Mobile Safari/537.36'
          curl -sL -A "$UA" 'https://www.tokmanni.fi/search/?q=6430056590875' -o t.html
          grep -c 6430056590875 t.html; grep -o '.\{200\}6430056590875.\{200\}' t.html | head -3
          grep -o -i '\(klevu\|algolia\|searchspring\|loop54\|findify\|doofinder\|elastic\|graphql\|api\)[^"'"'"' ]\{0,80\}' t.html | sort -u | head -20
          grep -o 'href="https://www.tokmanni.fi/[^"]*"' t.html | sort -u | grep -v '/search' | head -5
