# Väliaikainen: kauppojen tuotetietojen tutkimus oikealla selaimella. Poistetaan tutkimuksen jälkeen.
name: Probe data sources
on:
  push:
    paths: ['.github/workflows/probe.yml', 'scripts/probe/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node scripts/probe/tokmanni.mjs
        timeout-minutes: 10
